<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mushoku Tensei Footer Remover</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #2e1d04;
        color: #f5f2d7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 2rem;
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      input[type="file"] {
        margin-bottom: 1rem;
      }

      button {
        background: #59432e;
        color: #f5f2d7;
        border: none;
        padding: 0.75rem 1.5rem;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
      }

      button:hover {
        background: #7c5a3f;
      }
    </style>
  </head>
  <body>
    <h1>Mushoku Tensei Footer Remover</h1>
    <form action="/pdf-to-epub" method="post" enctype="multipart/form-data">
      <input type="file" name="inputFile" accept=".pdf" />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
